# Rotates the cron scripts' append-only, never-rotated-by-anything-else
# logs (deploy/run_daily.sh, the backup cron entry — see deploy/crontab.txt).
# Neither file has a long-lived writer holding it open — each cron
# invocation opens it fresh via shell `>>` redirection — so plain rotation
# (no copytruncate) is safe and preferred.
#
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/pitcrew-ai
# (adjust the path below first to wherever the repo actually lives on the
# VPS — same adjustment crontab.txt's entries need).
#
# 14-day retention matches scripts/backupDb.ts's own RETENTION_DAYS, for
# consistency across this project's two independent 14-day windows.
#
# `su ubuntu ubuntu` — logrotate (run as root via its own system cron/timer)
# refuses by default to touch files under a directory that's writable by a
# non-root group, as a safeguard against a lower-privileged user tricking a
# root process into an unsafe operation. If the repo's tree is group-
# writable on the target VPS (deploy convenience), this trips that check —
# `su` tells logrotate to perform the rotation as that user instead, which
# is the documented fix (not loosening the directory's permissions).
# Adjust the user/group below to match whichever account owns the repo.
/path/to/google-ads/backend/logs/*.log {
    daily
    rotate 14
    compress
    missingok
    notifempty
    su ubuntu ubuntu
}
